[package]
name = "hireling-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# E8's portability boundary is mechanical, not aspirational: the PRODUCTION
# dependency graph of this crate is serde-family only (asserted in CI by
# `cargo tree -p hireling-engine --edges normal` — see justfile). Dev
# dependencies (proptest, serde_json for fixture round-trips) never link
# into a host that harvests the engine.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0.151"

[lints]
workspace = true
