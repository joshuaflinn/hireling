name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # grizzly-gate, standalone checker mode — the gate is the first reviewer.
      # Pinned by digest (bearflinn/grizzly-gate:4ba8fc3). Bump deliberately, in
      # its own PR: a gate that moves on its own turns an unrelated upstream
      # release into a red PR on code nobody touched.
      - name: Run grizzly-gate
        run: >-
          docker run --rm
          -v "$PWD:/src"
          -v grizzly-gate-cache:/cache
          -w /src
          bearflinn/grizzly-gate@sha256:25c6193d39ee9460f8e0dc2413e728723943caeb2b550249061c045cab42bc4e
          --source /src
