name: gate

on:
  pull_request:
  push:
    branches: [main]

# The pinned gate image, named once: the docker run below and the cache key
# both read this, so a deliberate digest bump — always its own PR — rolls the
# cache key over with the same single edit instead of drifting apart.
env:
  GATE_IMAGE: bearflinn/grizzly-gate@sha256:25c6193d39ee9460f8e0dc2413e728723943caeb2b550249061c045cab42bc4e

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # grizzly-gate, standalone checker mode — the gate is the first reviewer.
      # Pinned by digest (bearflinn/grizzly-gate:4ba8fc3). Bump deliberately, in
      # its own PR: a gate that moves on its own turns an unrelated upstream
      # release into a red PR on code nobody touched.

      # Persist the gate's cargo state across runs. The gate image already
      # points CARGO_TARGET_DIR into the mounted volume (run logs show
      # artifacts landing in /cache/cargo-target); the registry follows
      # CARGO_HOME, which the docker run redirects into the same tree. The old
      # `grizzly-gate-cache` named volume could never work on an ephemeral
      # runner — docker creates it empty at job start and destroys it with the
      # VM — so this runner-host bind mount plus actions/cache is what
      # actually makes /cache survive between runs.
      #
      # Scope note, measured on run 37123430197: warm-cache savings land only
      # in the compile-side work (clippy's dep build ~2m, test's dep rebuild
      # ~2.5m, registry downloads). rust:test is dominated by test EXECUTION
      # (~34.4m of harness time vs ~2.5m of build), which no cache touches.
      # First run on a fresh branch is still warm: caches saved on the base
      # branch are readable from pull_request runs.
      #
      # Keys: exact key on lockfile + toolchain + image digest; restore falls
      # back to the same image, then to any prior gate tree. Stale artifacts
      # are safe — cargo fingerprints invalidate on compiler/toolchain change
      # and rebuild what moved.
      - name: Restore gate cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /home/runner/.cache/grizzly-gate
          key: grizzly-gate-${{ runner.os }}-${{ env.GATE_IMAGE }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            grizzly-gate-${{ runner.os }}-${{ env.GATE_IMAGE }}-
            grizzly-gate-${{ runner.os }}-

      # Repo-side guardrails, run before the image below. The gate image owns
      # 16 passes; `just ci-local` (see justfile) carries legs it has never
      # run — today web-test, web-build, json-keys, boundary; PR #83 swaps
      # web-build for web-css-guard and adds web-html-boundary. They ride
      # this job because the main-gate ruleset requires exactly one status
      # context, `gate` — a second job would publish an unrequired context
      # that could sit red while the merge button stays live. Every guard
      # step and the image run below carry if: ${{ !cancelled() }}: one red
      # run must list every failure it has (a json-keys red must not hide a
      # web-test red), while a real cancel still stops everything. The guards
      # buy earlier failure DETAIL, not an earlier red — the required
      # context publishes at job end either way.
      #
      # Host cargo steps read the restored gate registry ONLY with
      # CARGO_HOME pointed at it (boundary, below) — the default ~/.cargo
      # would cold-fetch the index this cache step just restored.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install node dependencies
        run: npm --prefix web ci

      # just, so the guard steps run the recipes themselves. Copied commands
      # drift from the justfile bodies exactly the way the leg lists drifted
      # to create these guards.
      - name: Install just
        if: ${{ !cancelled() }}
        run: cargo install just --locked

      - name: web-test — vitest suite
        if: ${{ !cancelled() }}
        run: just web-test

      - name: web-build — production bundle
        if: ${{ !cancelled() }}
        run: just web-build

      - name: json-keys — duplicate-key guard
        if: ${{ !cancelled() }}
        run: just json-keys

      - name: boundary — engine dependency gate
        if: ${{ !cancelled() }}
        run: just boundary
        env:
          CARGO_HOME: /home/runner/.cache/grizzly-gate/cargo

      # The guardrail guarding the guardrails: every ci-local leg must be
      # gated by the image passes (rust:fmt/clippy/test/deny,
      # node:svelte-check, node:eslint, scan:semgrep — the mapping lives in
      # the justfile) or by the guard steps above. Landing a ci-local leg
      # with no CI home turns this red and names the leg. (PR #83
      # red-checks here until its two legs replace web-build above:
      # deliberate.)
      - name: Drift check — no ci-local leg left ungated
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import re
          import sys

          justfile = open("justfile").read()
          m = re.search(r"^ci-local: *(.+)$", justfile, re.M)
          if not m:
              sys.exit("drift check: no ci-local recipe found in justfile")
          legs = m.group(1).split()

          # Legs the pinned gate image runs (the docker run below).
          mirrored = {
              "fmt-check", "lint", "test", "deny",
              "web-check", "web-eslint", "scan-semgrep",
          }
          # Legs the guard steps above run.
          repo_side = {"web-test", "web-build", "json-keys", "boundary"}

          ungated = sorted(set(legs) - mirrored - repo_side)
          if ungated:
              sys.exit(
                  "drift check: ci-local leg(s) gated by no CI job: "
                  + ", ".join(ungated)
                  + " — add them to the guard steps in this workflow"
                  " (or to `mirrored` if the gate image runs them)"
              )
          print(f"drift check ok: all {len(legs)} ci-local legs are gated")
          EOF

      # GIT_CONFIG_*/safe.directory: the cache restore extracts as the runner
      # user, so cached git state (cargo-deny's advisory DB, any future git
      # deps) comes back runner-owned while the container runs as root — git
      # then refuses it with "dubious ownership" and cargo-deny fails. Trust
      # every repo inside the container; the mount is CI-local by construction.
      - name: Run grizzly-gate
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm
          -v "$PWD:/src"
          -v "$HOME/.cache/grizzly-gate:/cache"
          -e CARGO_HOME=/cache/cargo
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=*
          -w /src
          "${{ env.GATE_IMAGE }}"
          --source /src

      # The container writes as root into the bind mount; the cache post-step
      # tars it back up as the runner user. Normalize ownership so a
      # root-owned 0600 file can never turn the save into a silent no-op — a
      # cache that quietly never saves looks exactly like no cache at all.
      - name: Normalize cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /home/runner/.cache/grizzly-gate || true


