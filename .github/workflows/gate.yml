name: gate

# merge_group: inert today and deliberately kept. GitHub grants the merge queue
# only to organization-owned repositories and this one is owned by a personal
# account, so no `merge_group` event is ever published here. The line stays
# because a queue entry publishes no `pull_request` event either — requiring a
# queue without this trigger parks every entry forever on a check that never
# runs — so keeping it is the difference between one ruleset call and a workflow
# change if ownership ever moves (docs/decisions/0002-merge-queue.md).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# The pinned gate image, named once: the cache key, the first restore-keys
# line, and the two step-level GATE_IMAGE_REF env lines below — four readers
# — all read this, so a deliberate digest bump — always its own PR — rolls
# the cache key and both docker runs over with the same single edit instead
# of drifting apart. The GATE_IMAGE_REF indirection keeps `${{ }}` out of
# `run:` bodies: the image's curl-pipe security rules hand a `run:` body to a
# Bash parser that cannot read GitHub expressions, and a skipped parse reads
# as a clean pass (gh#332).
env:
  GATE_IMAGE: bearflinn/grizzly-gate@sha256:25c6193d39ee9460f8e0dc2413e728723943caeb2b550249061c045cab42bc4e

jobs:
  gate:
    runs-on: ubuntu-24.04
    # Pinned label, not ubuntu-latest: this job does real work on the runner
    # host outside the pinned gate image — host-side cargo under a rustup
    # auto-install, setup-node + npm ci, a sudo install of the just musl
    # binary, docker run, a postgres:16-alpine service container, and the
    # hardcoded /home/runner/.cache/grizzly-gate cache path. The gate is this
    # repo's certificate; its host image moves only by a reviewed one-line PR,
    # never by ubuntu-latest riding a major OS migration into a red that
    # reads as a code defect.
    # The database-backed suite runs for real here. gh#125: the gate image
    # ships no Postgres, so every DB provision in every run before this
    # service existed burned sqlx's 30s acquire_timeout against a refused
    # 127.0.0.1:5432, took the harnesses' skip branch, and passed — 21 of
    # the gate's 25 minutes were that sleep, and not one database-backed
    # test had ever executed in CI.
    #
    # Major pinned to compose.yml's dev pin (16-alpine) so the gate answers
    # the same question a developer's `just ci-local` does; the docs' floor
    # is 16+. Verified against upstream at pin time (postgresql.org/versions):
    # current stable major is 18; 16 is still supported at 16.15. PGDATA on
    # tmpfs — CI durability is not under test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hireling
          POSTGRES_PASSWORD: hireling
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U hireling"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # grizzly-gate, standalone checker mode — the gate is the first reviewer.
      # Pinned by digest (bearflinn/grizzly-gate:4ba8fc3). Bump deliberately, in
      # its own PR: a gate that moves on its own turns an unrelated upstream
      # release into a red PR on code nobody touched.

      # Persist the gate's cargo state across runs. The gate image already
      # points CARGO_TARGET_DIR into the mounted volume (run logs show
      # artifacts landing in /cache/cargo-target); the registry follows
      # CARGO_HOME, which the docker run redirects into the same tree. The
      # runner-host bind mount plus actions/cache is what makes /cache
      # survive between runs: a docker named volume on an ephemeral runner is
      # created empty at job start and destroyed with the VM.
      #
      # Scope note, measured on run 37123430197: warm-cache savings land only
      # in the compile-side work (clippy's dep build ~2m, test's dep rebuild
      # ~2.5m, registry downloads). rust:test is dominated by test EXECUTION
      # (~34.4m of harness time vs ~2.5m of build), which no cache touches.
      # First run on a fresh branch is still warm: caches saved on the base
      # branch are readable from pull_request runs.
      #
      # Keys: exact key on the pinned runner label + lockfile + toolchain +
      # image digest; restore falls back to the same image, then to any prior
      # gate tree. The label is the literal ubuntu-24.04, matching the runs-on:
      # line — runner.os is "Linux" on every Ubuntu, so a runner-image change
      # under runner.os alone would restore a cache built on the old image
      # under an unchanged key. The literal must move in the same edit as
      # runs-on:; together they are the reviewed one-line PR. Stale artifacts
      # are safe — cargo fingerprints invalidate on compiler/toolchain change
      # and rebuild what moved.
      - name: Restore gate cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/grizzly-gate
          key: grizzly-gate-ubuntu-24.04-${{ env.GATE_IMAGE }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            grizzly-gate-ubuntu-24.04-${{ env.GATE_IMAGE }}-
            grizzly-gate-ubuntu-24.04-

      # Repo-side guardrails, run before the image below. The gate image owns
      # 16 passes; `just ci-local` (see justfile) carries legs it has never
      # run — disk-guard, web-test, web-css-guard, web-html-boundary,
      # json-keys, boundary. They ride this job because the main-gate ruleset
      # requires exactly one status context, `gate` — a second job would
      # publish an unrequired context
      # that could sit red while the merge button stays live. Every guard
      # step and the image run below carry if: ${{ !cancelled() }}: one red
      # run must list every failure it has (a json-keys red must not hide a
      # web-test red), while a real cancel still stops everything. The guards
      # buy earlier failure DETAIL, not an earlier red — the required
      # context publishes at job end either way.
      #
      # Host cargo steps read the restored gate registry ONLY with
      # CARGO_HOME pointed at it (boundary, below) — the default ~/.cargo
      # would cold-fetch the index this cache step just restored.
      # setup-node and the npm install carry the same !cancelled() as the
      # guards below: if the cache restore fails, these must still run, or
      # every guard leg fails downstream on a missing web/node_modules —
      # four cascading reds pointing at the wrong cause.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          # The one source for the node major is .nvmrc (with package.json
          # engines)
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install node dependencies
        if: ${{ !cancelled() }}
        run: npm --prefix web ci

      # just, so the guard steps run the recipes themselves. Copied commands
      # drift from the justfile bodies exactly the way the leg lists drifted
      # to create these guards.
      #
      # Upstream's prebuilt musl binary, pinned per toolkit-conventions
      # version pinning: crates.io just max-stable 1.58.0, re-verified from
      # the crates.io API on 2026-10-11 (MOR-143). The tarball's SHA256 was
      # taken from that release's SHA256SUMS asset at pin time and is
      # verified below before the binary lands — a replaced or re-tagged
      # asset fails this step instead of executing. The fetch retries: a
      # transient CDN failure must not redden the required gate on code
      # nobody touched. Nothing here warms a Rust toolchain: the disk-guard
      # step's host-side cargo — the first host cargo invocation, since it
      # is the first ci-local leg — gets the rust-toolchain.toml pin from
      # rustup's auto-install on its first invocation, and boundary below
      # reuses it. Bump deliberately:
      # version and sha256 move together, both read from upstream's
      # release assets at pin time.
      - name: Install just
        if: ${{ !cancelled() }}
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          scratch="$(mktemp -d)"
          cd "$scratch"
          curl --silent --show-error --location --fail \
            --retry 3 --retry-connrefused --retry-delay 2 \
            --output just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  just.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file just.tar.gz just
          sudo install --mode 0755 just /usr/local/bin/just
          just --version

      # Free-space floor, the first ci-local leg (justfile): fail before the
      # expensive legs when the runner cannot absorb another build. The
      # runner has ample headroom — the green run at 9487e3a logged
      # "disk-guard ok: 75.4G free on /" with the gate cache already
      # restored (gh run view 38742381851 --log | grep 'free on') — so CI
      # runs the bench's 10G default, no override. The decision lives in
      # diskops, a std-only zero-dep crate, so this compiles in seconds —
      # and it is the first host-side cargo invocation, warming the
      # rust-toolchain.toml pin before boundary below needs it. CARGO_HOME
      # points at the restored gate cache, same as boundary.
      - name: disk-guard — free-space floor
        if: ${{ !cancelled() }}
        run: just disk-guard
        env:
          CARGO_HOME: /home/runner/.cache/grizzly-gate/cargo

      - name: web-test — vitest suite
        if: ${{ !cancelled() }}
        run: just web-test

      # web-css-guard runs the production build and fails on the
      # css_unused_selector signature (MOR-124 F10); web-html-boundary is
      # the {@html} prose boundary (E9, contracts/inert-html.md §3).
      - name: web-css-guard — build + no dead scoped selectors
        if: ${{ !cancelled() }}
        run: just web-css-guard

      - name: web-html-boundary — no {@html} prose
        if: ${{ !cancelled() }}
        run: just web-html-boundary

      - name: json-keys — duplicate-key guard
        if: ${{ !cancelled() }}
        run: just json-keys

      - name: boundary — engine dependency gate
        if: ${{ !cancelled() }}
        run: just boundary
        env:
          CARGO_HOME: /home/runner/.cache/grizzly-gate/cargo

      # The ship self-guard's own gate (gh#101): `just ship` must refuse a
      # main checkout — the guard is the behavior, so the recipe itself is
      # what runs, against a throwaway main checkout whose remote is a
      # scratch bare repo (never origin). A recipe that silently loses the
      # guard later is the same hole again; this reds the moment it does.
      - name: ship-guard — ship refuses main
        if: ${{ !cancelled() }}
        run: just ship-guard

      # The guardrail guarding the guardrails (gh#151) — the same recipe
      # bench-side `just ci-local` runs, so bench and CI cannot drift apart:
      # every ci-local leg must have a CI home (an image mirror declared in
      # scripts/gate_passes.tsv, or a guard step here), and every declared
      # image pass must be mirrored by a leg ci-local actually runs or
      # carry its written exemption. scripts/gate_passes.tsv is the single
      # authority for the image's pass list — the buried `mirrored` literal
      # this step used to keep is gone. repo_side stays derived from this
      # file's own text, never a hand-kept literal (MOR-142, MOR-130 fault
      # class). Landing a ci-local leg with no CI home — or a declaration
      # row whose mirror names a leg ci-local doesn't run — turns this red
      # and names it.
      - name: Drift check — legs and declaration agree
        if: ${{ !cancelled() }}
        run: just ci-drift

      # The vendored-config drift check (gh#314): web/gate-eslint.config.mjs.tmpl
      # is vendored from the pinned image's own eslint flat config by
      # scripts/fetch_gate_file.py.
      # This step is that guard's CI home (direction A of ci-drift: a
      # repo-side leg needs a `run: just <leg>` step here) and reds when a
      # vendored copy stops hashing to what scripts/gate_vendored.tsv records.
      # A digest bump that forgets to re-vendor reds here before the image
      # even runs.
      #
      # --allow-unvendored: CI checks out a git tree, and gate-semgrep-rules/
      # is git-ignored, so the vendored rule directory is structurally absent
      # here — the same fetch that populates it is the one that cannot reach
      # the registry from a bare checkout any better than the bench can.
      # Absence is red on a bench (where `just vendor-semgrep` can run) and
      # opt-out tolerated here, because the image-side step below is what
      # actually proves the rules are the pinned ones. `just scan-semgrep`
      # does not run in CI at all: the image runs its own semgrep pass, which
      # reads its own on-image rules and never looks at this directory.
      - name: check-vendored — vendored config matches its recorded hash
        if: ${{ !cancelled() }}
        run: just check-vendored --allow-unvendored

      # The other half of gh#314: the pinned digest must still carry the
      # bytes we vendored. The offline check above hashes the vendored copies
      # against the manifest; this extracts every manifest row's file from
      # the image itself (cat via --entrypoint) and hashes each against the
      # manifest too. The loop reads scripts/gate_vendored.tsv, not a
      # hand-kept list, so a row added there is image-checked without a
      # second edit here; --require-image-sources reds if the loop missed a
      # row. Fails closed: a missing file, an unknown key, or a failed
      # docker run reds the step under bash -e.
      - name: check-vendored — image carries every vendored file
        if: ${{ !cancelled() }}
        env:
          GATE_IMAGE_REF: ${{ env.GATE_IMAGE }}
        run: |
          set -euo pipefail
          args=()
          while IFS=$'\t' read -r image_path _ _; do
            [ -n "$image_path" ] || continue
            if [ "${image_path%/}" != "$image_path" ]; then
              # Directory row: tar the subtree out of the image and unpack it.
              dir="$RUNNER_TEMP/image-$(printf '%s' "$image_path" | tr '/' '_').dir"
              mkdir -p "$dir"
              docker run --rm --entrypoint tar "$GATE_IMAGE_REF" \
                -c -C "/${image_path%/}" . | tar -x -C "$dir"
              args+=(--image-source "$image_path=$dir")
            else
              # File row: cat a single file out of the image.
              out="$RUNNER_TEMP/image-$(printf '%s' "$image_path" | tr '/' '_').tmp"
              docker run --rm --entrypoint cat "$GATE_IMAGE_REF" "/$image_path" > "$out"
              args+=(--image-source "$image_path=$out")
            fi
          done < <(grep -v '^#' scripts/gate_vendored.tsv)
          # --allow-unvendored: same reason as the offline step above — the
          # git-ignored rule directory is structurally absent from a CI
          # checkout, and this step's job is to prove the image still carries
          # the pinned bytes (check_image_sources), not the local tree.
          python3 scripts/check_gate_vendored.py --allow-unvendored --require-image-sources "${args[@]}"

      # The image's pinned semgrep version, asserted against the number named
      # in scripts/gate_passes.tsv's scan:semgrep row (MOR-727). The bench
      # installs semgrep unpinned (pipx install semgrep); the image pins its
      # own. PR #139 is the precedent: a bench tool at a different version
      # than the image's can answer a different question and stay green. The
      # expected semver is read from the scan:semgrep row — the single
      # repo-side authority — and compared to the image's own
      # `semgrep --version`; a mismatch reds, so the row cannot drift
      # uncaught and the number is never restated here. A failed docker run
      # reds too (bash -e over the substitution and the grep).
      - name: semgrep version — image's pinned CLI matches the declared row
        if: ${{ !cancelled() }}
        env:
          GATE_IMAGE_REF: ${{ env.GATE_IMAGE }}
        run: |
          set -euo pipefail
          expected="$(awk -F'\t' '$1 == "scan:semgrep" { print $3 }' scripts/gate_passes.tsv \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$expected" ]; then
            echo "semgrep version: no semver found in the scan:semgrep row" >&2
            exit 1
          fi
          actual="$(docker run --rm --entrypoint semgrep "$GATE_IMAGE_REF" --version)"
          printf 'semgrep version: image %s, scan:semgrep row %s\n' "$actual" "$expected"
          printf '%s\n' "$actual" | grep -qx "$expected" || {
            echo "semgrep version drift: image $actual != scan:semgrep row $expected" >&2
            exit 1
          }

      # The runner-label drift check (gh#331): the workflow's `runs-on:`
      # label and the label embedded in the cache key/restore-keys must
      # agree. PR #319 made the runner label a hand-kept literal in four
      # places; a mismatch is a silent cache miss, not a red gate (runner.os
      # is "Linux" on every Ubuntu, so the key cannot catch it either). This
      # step is that guard's CI home and reds when the workflow's own text
      # drifts — runs-on moved but the key stayed, or the reverse.
      - name: check-runner-label — runner label matches the cache key
        if: ${{ !cancelled() }}
        run: just check-runner-label

      # GIT_CONFIG_*/safe.directory: the cache restore extracts as the runner
      # user, so cached git state (cargo-deny's advisory DB, any future git
      # deps) comes back runner-owned while the container runs as root — git
      # then refuses it with "dubious ownership" and cargo-deny fails. Trust
      # every repo inside the container; the mount is CI-local by construction.
      # The guards must leave the tree as the image expects to find it. A
      # host-installed web/node_modules survives the image's own npm ci as
      # .grizzly-gate.node_modules (observed on runs 38085893214 and
      # 38085913608: with node_modules present, node:eslint lints dependency
      # sources — that dotted name escapes eslint's node_modules ignore —
      # and fails on third-party code; without it, the same pass is green).
      # The image installs its own deps; web/dist is a build artifact it
      # never sees otherwise.
      #
      # ORDERING HAZARD: this must stay the LAST tree-touching step — a web-*
      # recipe leg (or any npm install) added AFTER it silently reinstalls
      # web/node_modules and reds node:eslint via the
      # .grizzly-gate.node_modules escape described above. New legs go
      # before this step.
      - name: Clean guard artifacts before the image run
        if: ${{ !cancelled() }}
        run: rm -rf web/node_modules web/dist

      - name: Run grizzly-gate
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GATE_IMAGE_REF: ${{ env.GATE_IMAGE }}
        run: |
          set -o pipefail
          docker run --rm \
            --network host \
            -v "$PWD:/src" \
            -v "$HOME/.cache/grizzly-gate:/cache" \
            -e CARGO_HOME=/cache/cargo \
            -e HIRELING_TEST_DATABASE_URL=postgres://hireling:hireling@127.0.0.1:5432/postgres \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=* \
            -w /src \
            "$GATE_IMAGE_REF" \
            --source /src 2>&1 | tee "$RUNNER_TEMP/gate-image-output.log"
        # --network host: the gate container's 127.0.0.1 is its own network
        # namespace, so without this the service Postgres above is unreachable
        # no matter what the env says (gh#125). Host networking puts the
        # service's published port inside the container's own loopback.
        # HIRELING_TEST_DATABASE_URL is set EXPLICITLY, not left to the
        # harness default, on purpose: all three test harnesses fail CLOSED
        # on a requested-but-unreachable database (testing::test_pool,
        # src/tests/db.rs, tests/import_db.rs). If this service container
        # ever fails to come up, the suite goes red in seconds — it does not
        # rot back to silently skipping every DB-backed test, which is the
        # fault gh#125 exists for.
        #
        # The tee (gh#151): the image's stdout is the only record of which
        # passes it ran that the repo can read ([PASS] node:tsc lines), and
        # the step below certifies the declaration against it. set -o
        # pipefail is the boundary recipe's lesson applied: without it the
        # pipeline's status is tee's, and a red image would die quietly in
        # the pipe while the log got saved.

      # Close the declaration against the image itself (gh#151). The image's
      # own stdout names the passes it ran; this parse fails on any pass
      # scripts/gate_passes.tsv does not declare — which is what makes the
      # declaration survive a digest bump instead of certifying a list
      # nobody re-read. The old comment here said the image's pass list was
      # not readable; true of a repo-side parse, false of the image's own
      # output. Fails closed: a log with no pass tokens (empty output, an
      # unreadable run) is a failure, not a pass. The deliberate-break run
      # is the cover, per the precedent in the drift-check step's old
      # comment (run 38088014628 for web-test): a guard proven to red on
      # the thing it guards is evidence a parse cannot be.
      - name: Drift check — image output names nothing undeclared
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_drift_check.py --image-log "$RUNNER_TEMP/gate-image-output.log"

      # The container writes as root into the bind mount; the cache post-step
      # tars it back up as the runner user. Normalize ownership so a
      # root-owned 0600 file can never turn the save into a silent no-op — a
      # cache that quietly never saves looks exactly like no cache at all.
      - name: Normalize cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /home/runner/.cache/grizzly-gate || true
