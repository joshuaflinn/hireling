[package]
name = "hireling"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
# HTTP client for the pinned-release fetch (api.github.com + release asset
# download) — std has no HTTP story; reqwest on rustls keeps the boring stack
# and avoids the OpenSSL toolchain. Retry/backoff is hand-rolled on top.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# sha256 for the asset digest check and per-row content hashes (FR-3, FR-6).
sha2 = "0.11.0"
# Postgres driver (the settled stack's `sqlx`); E4 carries no migrations —
# E2 owns all DDL — so no `migrate` feature.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Release-asset archive reading (json-assets.zip) for the extract stage.
# Deflate only: the upstream pack assets are plain deflate zips, so the
# default features (bzip2/lzma/zstd/aes-crypto) are dead weight — and the
# bzip2 leg carried a license the deny allow list rightly didn't know.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Lint configuration
#
# These rules are intentionally strict. This project is primarily developed
# and maintained by AI coding agents, and agents will take every shortcut
# that isn't explicitly denied. Warnings get ignored; only hard errors
# change behavior. The strictness here is a substitute for the discipline
# a human developer would bring naturally.
#
# Human contributors: the pre-commit hooks enforce everything, so you'll
# know immediately if something needs fixing.

[lints.rust]
# deny rather than forbid so FFI boundaries can use a targeted
# #[expect(unsafe_code, reason = "...")] — forbid cannot be overridden at the item level.
unsafe_code = "deny"

[lints.clippy]
# Pedantic baseline. Kept at warn (not deny) because new clippy versions
# add lints to this group — deny would break builds on toolchain upgrades
# with no code changes. Individual lints below override where needed.
pedantic = { level = "warn", priority = -1 }

# --- Error handling: no shortcuts, no silent failures ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
# Domain errors are named for what failed, not `Error`. A type literally called
# `Error` collides with every other crate's and reads as "the" error type.
error_impl_error = "deny"

# --- Panic prevention beyond unwrap/expect ---
indexing_slicing = "deny"
string_slice = "deny"

# --- Prevent incomplete/debug code from shipping ---
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- Controlled exit points (only main.rs may call process::exit) ---
exit = "deny"

# --- Code complexity ---
too_many_lines = "deny"

# --- Documentation and API discipline ---
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"

# --- Assertion quality ---
missing_assert_message = "deny"

# --- Lint suppression hygiene ---
# Every #[allow] must use #[expect] instead (warns when suppression is stale)
allow_attributes = "deny"
# Every suppression must explain why
allow_attributes_without_reason = "deny"

# --- Code quality enforcement ---
format_push_string = "deny"
redundant_type_annotations = "deny"
needless_raw_strings = "deny"
tests_outside_test_module = "deny"
empty_structs_with_brackets = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
clone_on_ref_ptr = "deny"
multiple_inherent_impl = "deny"
same_name_method = "deny"
unseparated_literal_suffix = "deny"
if_then_some_else_none = "deny"
shadow_unrelated = "deny"
wildcard_enum_match_arm = "deny"

# --- Antipatterns ---
rc_buffer = "deny"
rc_mutex = "deny"

# --- Keep relaxed (stylistic) ---
module_name_repetitions = "allow"
