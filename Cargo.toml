[package]
name = "hireling"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The engine crate (E8) is the portable buff/effect core: serde-only prod
# deps, its own test suites. The binary is the workspace's other member.
[workspace]
members = ["engine"]

[dependencies]
anyhow = "1.0.104"
# E7 party sync rides axum's WebSocket upgrade (contract §1:
# GET /api/ws/party/{party_id}); the feature only compiles the extractor —
# no new server behavior unless a route uses it.
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie = { version = "0.18.2", features = ["signed", "key-expansion"] }
# `aws_lc_rs` pins the CryptoProvider: with no feature, jsonwebtoken 11
# panics at the first key operation (ID-token verify) instead of choosing.
# The `rust_crypto` alternative is banned — it pulls `rsa`
# (RUSTSEC-2023-0071), which the gate fail-closes on.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
# HTTP client for the pinned-release fetch (api.github.com + release asset
# download) — std has no HTTP story; reqwest on rustls keeps the boring stack
# and avoids the OpenSSL toolchain. Retry/backoff is hand-rolled on top.
# E3 adds the `json`/`form` features for the OIDC token exchange.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# sha256 for the asset digest check and per-row content hashes
# (E4: FR-3, FR-6).
sha2 = "0.11.0"
# Postgres driver + the `sqlx migrate` tool the settled stack mandates
# (epic E2; Constitution V). Minimal features: no TLS — the database is
# reached over the trusted house bridge (asgard-net), not the public internet.
# `json` for E4's serde_json bindings into jsonb columns. E4 carries no
# migrations — E2 owns all DDL — so `migrate` stays in this feature set.
# 0.9, not 0.8: the gate's osv-scanner flags RUSTSEC-2023-0071 against rsa
# 0.9.x, which 0.8's (unactivated) sqlx-mysql optional chain pins into the
# lockfile; 0.9's mysql chain uses rsa 0.10.0-rc, outside the advisory.
# `chrono` (E3): session rows carry timestamptz idle/absolute deadlines that
# bind and read back as `chrono::DateTime<Utc>`.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "json",
] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Release-asset archive reading (json-assets.zip) for the extract stage.
# Deflate only: the upstream pack assets are plain deflate zips, so the
# default features (bzip2/lzma/zstd/aes-crypto) are dead weight — and the
# bzip2 leg carried a license the deny allow list rightly didn't know.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Splitting the session socket into read/write halves for the select loop
# (E7 session). Already in the tree via axum/tungstenite; sink feature only.
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
# Design-gate blessed (specs/007-party-sync/design.md, plan Task 6): the
# session tests drive a real socket against a real listener (PR #30 house
# rule). axum's `ws` feature already pulls tungstenite into the tree — this
# dev-dependency only exposes a client for the test harness; no production
# path touches it.
# Pinned to axum 0.8.9 ws feature's own tungstenite (0.29) — one copy in the tree.
tokio-tungstenite = "0.29"
# The ack-loss race test (review finding): the vanishing writer's socket is
# closed with SO_LINGER 0 so the kernel sends RST — the server's ack write
# then fails the way a dead peer makes it fail in production. Already in the
# dependency graph via tokio; this only exposes it to tests.
socket2 = "0.6"

# Lint configuration
#
# These rules are intentionally strict. This project is primarily developed
# and maintained by AI coding agents, and agents will take every shortcut
# that isn't explicitly denied. Warnings get ignored; only hard errors
# change behavior. The strictness here is a substitute for the discipline
# a human developer would bring naturally.
#
# Human contributors: the pre-commit hooks enforce everything, so you'll
# know immediately if something needs fixing.
#
# Declared once at workspace level; every member crate inherits verbatim
# via `[lints] workspace = true` — one law, no drift between crates.

[workspace.lints.rust]
# deny rather than forbid so FFI boundaries can use a targeted
# #[expect(unsafe_code, reason = "...")] — forbid cannot be overridden at the item level.
unsafe_code = "deny"

[workspace.lints.clippy]
# Pedantic baseline. Kept at warn (not deny) because new clippy versions
# add lints to this group — deny would break builds on toolchain upgrades
# with no code changes. Individual lints below override where needed.
pedantic = { level = "warn", priority = -1 }

# --- Error handling: no shortcuts, no silent failures ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
# Domain errors are named for what failed, not `Error`. A type literally called
# `Error` collides with every other crate's and reads as "the" error type.
error_impl_error = "deny"

# --- Panic prevention beyond unwrap/expect ---
indexing_slicing = "deny"
string_slice = "deny"

# --- Prevent incomplete/debug code from shipping ---
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- Controlled exit points (only main.rs may call process::exit) ---
exit = "deny"

# --- Code complexity ---
too_many_lines = "deny"

# --- Documentation and API discipline ---
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"

# --- Assertion quality ---
missing_assert_message = "deny"

# --- Lint suppression hygiene ---
# Every #[allow] must use #[expect] instead (warns when suppression is stale)
allow_attributes = "deny"
# Every suppression must explain why
allow_attributes_without_reason = "deny"

# --- Code quality enforcement ---
format_push_string = "deny"
redundant_type_annotations = "deny"
needless_raw_strings = "deny"
tests_outside_test_module = "deny"
empty_structs_with_brackets = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
clone_on_ref_ptr = "deny"
multiple_inherent_impl = "deny"
same_name_method = "deny"
unseparated_literal_suffix = "deny"
if_then_some_else_none = "deny"
shadow_unrelated = "deny"
wildcard_enum_match_arm = "deny"

# --- Antipatterns ---
rc_buffer = "deny"
rc_mutex = "deny"

# --- Keep relaxed (stylistic) ---
module_name_repetitions = "allow"

[lints]
workspace = true
