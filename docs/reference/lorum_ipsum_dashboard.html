<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorum Ipsum · PF2e Dashboard</title>
<style>
:root{
  --bg:#111317; --panel:#1a1d23; --panel2:#21252d; --line:#2e333d; --line2:#3a404c;
  --text:#e9e5d9; --muted:#a2a8b3; --dim:#6d7480;
  --gold:#dcb25b; --gold-dim:#8d7239; --maroon:#5f1d1d; --unc:#9a4f2e; --trad:#2c4a6e; --size:#3b6436;
  --cs:#7fd6a0; --s:#a9cf86; --f:#e3a45a; --cf:#e46b5e; --blue:#7fb0de;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1b1a17,#111317)}
.top h1{font-family:var(--serif);font-size:30px;margin:0;color:var(--gold);letter-spacing:.5px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 12px}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{border-color:var(--gold-dim);color:var(--gold)}
.lvl{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--panel2)}
.lvl button{background:none;border:0;padding:6px 11px;font-size:16px;line-height:1}
.lvl button:disabled{opacity:.3;cursor:default}
.lvl span{padding:0 8px;font-size:13px;color:var(--muted)}
.lvl b{color:var(--text);font-size:16px}
.namerow{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.datanote{color:var(--dim);font-size:11.5px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline;max-width:520px}
.datanote b{color:var(--muted);font-weight:600}
.datanote .lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:11.5px}

/* independent columns: each panel stacks directly under the one above it */
.cols{display:flex;gap:12px;padding:12px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col1{flex:0 0 330px}.colMain{flex:1.25 1 0;gap:0}.col3{flex:1 1 0;padding-top:37px}
@media (max-width:1250px){.cols{flex-wrap:wrap}.colMain{flex:1 1 0}.col3{flex:1 1 100%;padding-top:0}}
.maintabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 4px}
.maintabs button{background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:7px 16px;color:var(--muted);font-family:var(--serif);font-size:16px;margin-bottom:-1px}
.maintabs button.on{background:var(--panel);border-color:var(--line);color:var(--gold)}
.tabpane{border-top-left-radius:0}
@media (max-width:780px){.cols{display:flex;flex-direction:column;align-items:stretch}.col1{flex:none}.colMain{max-width:none}.col3{flex:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;min-width:0}
.pet-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:13px;white-space:nowrap}
.pet-line span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
#pMinions .pet-line{max-width:440px}
.pet-line b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-left:3px}
.pet-list{margin-top:8px;font-size:13px}
.pet-list p{margin:3px 0}
.pet-list b{font-weight:600}
.pet-note{color:var(--muted);font-size:12.5px;margin-top:6px}
.pet-src{color:var(--dim);font-size:11.5px;margin-top:4px}
.panel h2{font-family:var(--serif);font-weight:normal;color:var(--gold);font-size:19px;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--sans);color:var(--muted);font-size:12px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:12px 0 5px;font-weight:600}

/* stats */
.hp{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hp-top{display:flex;justify-content:space-between;align-items:baseline}
.hp-top .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.hpnum{font-size:14px;color:var(--muted)}
.hpnum b{font-size:26px;color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#2a2f38;border-radius:3px;margin:5px 0 7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3452f,#d9a142 60%,#6fbf73)}
.bar i.tmp{background:var(--blue)}
.hp-btns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.hp-btns button{background:#2a2f38;border:1px solid var(--line2);border-radius:5px;padding:2px 8px;font-size:13px;min-width:34px}
.hp-btns button:hover{border-color:var(--gold-dim)}
.hp-btns .tmpin{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.hp-btns input{width:44px;background:#2a2f38;border:1px solid var(--line2);border-radius:5px;color:var(--text);padding:2px 4px;font:inherit;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;text-align:center;cursor:default}
.tile .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.tile .x{font-size:11px;color:var(--dim)}
.tile.gold .v{color:var(--gold)}
.trackers{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.trk{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.trk .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.pips{display:flex;gap:4px}
.pip{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gold-dim);background:none;padding:0}
.pip.on{background:var(--gold);border-color:var(--gold)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.attr{background:var(--panel2);border:1px solid var(--line);border-radius:6px;text-align:center;padding:3px 0}
.attr .k{font-size:10px;letter-spacing:1px;color:var(--muted)}
.attr .v{font-size:16px;font-weight:600}
.attr.key{border-color:var(--gold-dim)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
.sk{display:flex;align-items:center;gap:6px;padding:2px 2px;border-bottom:1px dotted #2a2f38;font-size:13px;min-width:0}
.sk .rk{width:15px;height:15px;border-radius:3px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:#2a2f38;color:var(--dim);flex:none}
.sk .rk.r2{background:#34506e;color:#dfe9f5}.sk .rk.r4{background:#6a4f9a;color:#f0eaff}.sk .rk.r6{background:#9a6a20;color:#fff3dc}.sk .rk.r8{background:#8a2a2a;color:#ffe}
.sk .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .m{font-variant-numeric:tabular-nums;font-weight:600}
.sk.untr .n,.sk.untr .m{color:var(--dim)}
.sk.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.trait{display:inline-block;background:var(--maroon);color:#f3e6e0;font-size:10.5px;padding:1px 6px;border-radius:3px;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.trait.unc{background:var(--unc)}.trait.trad{background:var(--trad)}.trait.size{background:var(--size)}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.meta b{color:var(--text);font-weight:600}

/* rows */
.row{display:grid;grid-template-columns:20px 56px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:help;min-height:30px}
.row:hover,.row.pinned{background:var(--panel2)}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .q{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.glyph{display:inline-flex;align-items:center;gap:2px;color:var(--text);white-space:nowrap;line-height:1}
.glyph svg{height:13px;width:auto;display:block;overflow:visible}
.glyph .dash{font-size:11px;color:var(--muted);margin:0 1px}
.glyph.txt{font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:1px 3px;justify-self:start}
.chip{font-size:10.5px;padding:1px 6px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.slot,.chip.book{border-color:#4b3f6e;color:#c9b9ef}
.chip.focus{border-color:#6e4b3f;color:#efc3b0}
.chip.innate{border-color:#3f6e5a;color:#b0efcf}
.chip.cantrip{border-color:#3f566e;color:#b8d3ef}
.use{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);background:none;padding:0;font-size:11px;line-height:1;color:var(--cf)}
.use:hover{border-color:var(--gold)}
.use.on{border-color:var(--cf);background:#3a2020}
.use.none{border:0}
.use.lock{display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.row.spent .nm,.row.spent .q{text-decoration:line-through;color:var(--dim)}
.row.empty{cursor:default;color:var(--dim);font-style:italic;font-size:13px}
.row.empty:hover{background:none}
.row.locked{background:rgba(63,110,90,.08)}
.row.staffslot{background:rgba(220,178,91,.12);box-shadow:inset 3px 0 0 rgba(220,178,91,.55);cursor:help}
.row.staffslot:hover{background:rgba(220,178,91,.18)}
.row.currslot{background:rgba(120,140,220,.10);box-shadow:inset 3px 0 0 rgba(150,170,240,.5)}
.cur{color:var(--gold);font-size:11px}
.src-tag{margin-left:6px;font-size:10.5px;color:#b0efcf;border:1px solid #3f6e5a;border-radius:3px;padding:0 4px;font-weight:400;vertical-align:1px}
.src-tag.staff-tag{color:#e8c77a;border-color:rgba(220,178,91,.6)}
.src-tag.curr-tag{color:#c9b9ef;border-color:#4b3f6e}
.staff-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 6px 2px;font-size:12.5px;color:var(--muted)}
.staff-ctl select,.staff-pick select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;font:inherit;font-size:12.5px}
.staff-pick{margin:4px 6px 4px 90px}
.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:12px;cursor:pointer}
.rank-h{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;padding:0 6px 3px;border-bottom:1px solid var(--line)}
.rank-h .t{font-family:var(--serif);font-size:15px;color:var(--text)}
.rank-h .s{font-size:12px;color:var(--muted);flex:1}
.rank-h .r{font-size:12px;color:var(--muted)}
.caster-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 4px}
.caster-h .cname{font-family:var(--serif);font-size:16px;color:var(--gold);margin-right:4px}
.pill{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--gold);border-color:var(--gold-dim);cursor:help}
.pill button{background:none;border:0;padding:0;color:inherit;text-decoration:underline}
details.book{margin-top:10px}
details.book summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:4px 6px;list-style:none}
details.book summary::before{content:"▸ ";color:var(--gold)}
details.book[open] summary::before{content:"▾ "}
.divider{height:1px;background:var(--line);margin:12px 0 4px}
.rank-h .warn{color:var(--f)}
.row[draggable="true"]{cursor:grab}
.row.dragsrc{opacity:.4}
.drop-ok{outline:1px dashed var(--gold-dim);outline-offset:-1px;border-radius:6px}
.drop-hover{outline:1px solid var(--gold) !important;background:#2a2415 !important}
details.book.drop-ok>summary{color:var(--gold)}

/* tabs */
.tabs{display:flex;gap:4px;margin:-2px 0 6px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:6px;padding:3px 10px;color:var(--muted);font-size:13px}
.tabs button.on{border-color:var(--gold-dim);color:var(--gold);background:var(--panel2)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:10px 6px 2px;font-weight:600}
.arow{grid-template-columns:56px auto minmax(0,1fr)}
.arow .q{text-align:right;overflow:hidden;text-overflow:ellipsis}

/* collapsible group headers */
[data-coll]{cursor:pointer;user-select:none}
.car{display:inline-block;width:12px;font-size:9px;color:var(--muted);transition:transform .12s;margin-right:4px}
[data-coll].closed .car{transform:rotate(-90deg)}
.secb.closed{display:none}
.cn{margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);font-size:11px}
.h3s{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;margin-left:6px}

/* minions */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin:4px 0 8px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.mcard .mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:3px;margin-bottom:4px}
.mcard .mh b{font-family:var(--serif);font-size:16px;color:var(--gold);font-weight:normal}
.mcard p{margin:2px 0}
.mcard .glyph svg{height:11px}
.mcard .foot{margin-top:5px;font-size:11px;color:var(--dim)}

/* inventory */
.coins{display:flex;gap:6px;margin-bottom:6px}
.coin{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;text-align:center;padding:3px 0}
.coin .v{font-size:17px;font-weight:600}
.coin .k{font-size:10px;letter-spacing:1px;color:var(--muted)}
.coin.gp .v{color:var(--gold)}.coin.sp .v{color:#c9ced6}.coin.cp .v{color:#c98a5a}.coin.pp .v{color:#b9d4e6}
.coin input{width:100%;max-width:70px;background:#2a2f38;border:1px solid var(--line2);border-radius:4px;color:var(--text);padding:1px 4px;font:inherit;font-size:15px;text-align:center}
.coin[data-coin]{cursor:pointer}
.coin[data-coin]:hover{border-color:var(--gold-dim)}
.irow{grid-template-columns:minmax(0,1fr) auto auto}
.irow .qty{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.bulk{margin-top:8px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--muted)}
.bulk b{color:var(--text)}
.bulk .meter{height:6px;border-radius:3px;background:#2a2f38;margin-top:5px;position:relative;overflow:hidden}
.bulk .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--s)}
.bulk .meter i.enc{background:var(--f)}

/* familiar */
.fam{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.fam .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--line2);padding-bottom:3px;margin-bottom:5px}
.fam .hd b{font-family:var(--serif);font-size:16px;color:var(--gold);font-weight:normal}
.fam p{margin:3px 0}
.fam .src{color:var(--dim);font-size:11.5px}

/* tooltip */
#tip{position:fixed;z-index:50;width:440px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:#0d0f13;border:1px solid var(--gold-dim);border-radius:10px;padding:10px 12px;box-shadow:0 12px 36px rgba(0,0,0,.6);font-size:13px;line-height:1.45}
#tip.pinned{border-color:var(--gold)}
.tt-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:6px}
.tt-name{font-family:var(--serif);font-size:18px;color:var(--gold)}
.tt-name .glyph{margin-right:7px;color:var(--gold);vertical-align:-1px}
.tt-name .glyph svg{height:14px}
.tt-rank{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap}
#tip .traits{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;margin-bottom:6px}
.kv div{font-size:12.5px}
.kv b,.line b{color:var(--text);font-weight:600}
.kv .full{grid-column:1/-1}
.line{margin:4px 0;padding:5px 8px;background:#171a20;border-left:2px solid var(--gold-dim);border-radius:4px}
#tip p{margin:6px 0}
.deg{margin:6px 0;display:grid;gap:2px}
.deg .d{padding:2px 8px;border-radius:4px;background:#171a20}
.deg .d b{font-weight:600;margin-right:4px}
.deg .cs b{color:var(--cs)}.deg .s b{color:var(--s)}.deg .f b{color:var(--f)}.deg .cf b{color:var(--cf)}
.hi{margin:6px 0;font-size:12.5px}
.hi div{color:var(--dim)}
.hi div.act{color:var(--text)}
.hi div b{color:var(--muted)}
.hi div.act b{color:var(--gold)}
.notes{margin:6px 0;font-size:12.5px;color:#d7c9a5}
.notes div::before{content:"• ";color:var(--gold)}
.conds{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);font-size:12px;color:var(--muted)}
.conds b{color:var(--text)}
.foot{margin-top:8px;padding-top:6px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{color:var(--dim);font-size:11px;text-align:right;margin-top:4px}
.cond{color:#e9c47c;border-bottom:1px dotted rgba(233,196,124,.75);cursor:help}
.row .q .cond{color:inherit}
#ctip{position:fixed;z-index:70;width:340px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:#16130d;border:1px solid var(--gold);border-radius:8px;padding:8px 11px;box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:12.5px;line-height:1.45}
#ctip .tt-name{font-size:16px}
#ctip p{margin:5px 0}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold-dim);border-radius:10px;width:min(620px,94vw);padding:14px 16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-family:var(--serif);color:var(--gold);margin:0 0 6px;font-weight:normal;font-size:20px}
dialog textarea{width:100%;height:220px;background:#0d0f13;color:var(--text);border:1px solid var(--line2);border-radius:6px;font:12px/1.3 Consolas,monospace;padding:6px}
dialog .err{color:var(--cf);font-size:13px;min-height:18px}
dialog .row2{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px}

/* campaign reference */
.cref{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 10px;align-items:start;margin:3px 0;font-size:13px}
.cref .ck{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:600}
.npcrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,1fr) auto;gap:8px;padding:3px 6px;font-size:13px;border-bottom:1px dotted var(--line)}
.npctag{font-size:10.5px;letter-spacing:.5px;border:1px solid var(--line2);border-radius:10px;padding:1px 7px;color:var(--muted);white-space:nowrap}

/* rules clarifications */
.rule{margin:6px 0 9px}
.rule .rt{font-weight:600;color:var(--text)}
.rule .rb{font-size:13px;margin-top:1px}
.rule .rs{font-size:11px;color:var(--dim);margin-top:1px}
</style>
</head>
<body>

const COND_RE = new RegExp("\\b("+Object.keys(CONDITIONS).sort((a,b)=>b.length-a.length).map(k=>k.replace("-","\\-")).join("|")+")\\b(?![- ]actions?\\b)","gi");
// wrap condition names in hoverable links; only touches text, never tags or attributes
function linkConds(html, self){
  return String(html).split(/(<[^>]+>)/).map(seg=> seg.startsWith("<") ? seg :
    seg.replace(COND_RE, m=>{ const k=m.toLowerCase(); return k===self ? m : `<span class="cond" data-cond="${k}">${m}</span>`; })).join("");
}

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sg = n => (n<0?"−":"+")+Math.abs(n);
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const ordn = n => n===1?"1st":n===2?"2nd":n===3?"3rd":n+"th";
const GLYPH_TITLE = {1:"Single action",2:"Two actions",3:"Three actions",R:"Reaction",F:"Free action"};
// PF2e action symbols as inline SVG: n chevrons leading into a diamond; free = outlined; reaction = hooked arrow
// Matched to the Pathfinder icon font used by Archives of Nethys: a small diamond, then one notched
// arrowhead per action (each later one a little smaller). Free = outlined diamond; reaction = hooked arrow.
function actionSVG(a){
  if(a==="R") return `<svg viewBox="0 0 20 16" aria-hidden="true"><path d="M0.4,4.3 C3.5,0.2 10,-0.6 14.8,1.1 C19.6,2.9 20.9,8.6 17.4,11.4 C16.4,12.2 15.2,12.8 13.9,13.2 L12.1,15.9 L3.3,14 L10.3,10.2 L12.3,11.7 C15.3,10.4 16,6.2 13.4,4.3 C10.4,2.1 4.6,2 1.3,3.3 Z" fill="currentColor"/></svg>`;
  if(a==="F") return `<svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0.9 15.1,8 8,15.1 0.9,8" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="6.1,4.2 9.9,8 6.1,11.8 4.2,9.9 6.1,8 4.2,6.1" fill="currentColor"/></svg>`;
  const n=Math.min(3,Math.max(1,+a)), CX=[7.9,18.2,27.6], SC=[1,0.9,0.69], W=[0,15.9,25.4,33.2];
  const parts=["2.8,5.2 5.6,8 2.8,10.8 0,8"];
  for(let k=0;k<n;k++){ const cx=CX[k], h=8*SC[k];
    parts.push([[cx,8-h],[cx+h,8],[cx,8+h],[cx-0.48*h,8+0.52*h],[cx+0.04*h,8],[cx-0.48*h,8-0.52*h]].map(p=>p.map(v=>+v.toFixed(2)).join(",")).join(" ")); }
  return `<svg viewBox="0 0 ${W[n]} 16" aria-hidden="true">${parts.map(p=>`<polygon points="${p}" fill="currentColor"/>`).join("")}</svg>`;
}
function glyph(a){
  if(a==null) return "<span></span>";
  if(GLYPH_TITLE[a]) return `<span class="glyph" title="${GLYPH_TITLE[a]}">${actionSVG(String(a))}</span>`;
  const range = String(a).match(/^([123])\s*[–-]\s*([123])$/);
  if(range) return `<span class="glyph" title="${range[1]} to ${range[2]} actions">${actionSVG(range[1])}<span class="dash">–</span>${actionSVG(range[2])}</span>`;
  return `<span class="glyph txt">${esc(a)}</span>`;
}
function traitsHTML(list){ return (list||[]).map(t=>`<span class="trait ${t==="Uncommon"||t==="Rare"?"unc":""}">${esc(t)}</span>`).join(""); }

const SKILLS = [["acrobatics","Acrobatics","dex"],["arcana","Arcana","int"],["athletics","Athletics","str"],["crafting","Crafting","int"],["deception","Deception","cha"],["diplomacy","Diplomacy","cha"],["intimidation","Intimidation","cha"],["medicine","Medicine","wis"],["nature","Nature","wis"],["occultism","Occultism","int"],["performance","Performance","cha"],["religion","Religion","wis"],["society","Society","int"],["stealth","Stealth","dex"],["survival","Survival","wis"],["thievery","Thievery","dex"]];

function computeCtx(B, L){
  const M={}; for(const k of ["str","dex","con","int","wis","cha"]) M[k]=Math.floor((B.abilities[k]-10)/2);
  const P=Object.assign({},B.proficiencies);
  const up=(k,r)=>{P[k]=Math.max(P[k]||0,r)};
  if(B.class==="Wizard" && L>B.level){   // Player Core wizard class progression
    if(L>=5)up("reflex",4); if(L>=7)up("castingArcane",4); if(L>=9)up("fortitude",4);
    if(L>=11){up("perception",4);up("simple",4);up("unarmed",4);}
    if(L>=13)up("unarmored",4); if(L>=15)up("castingArcane",6); if(L>=17)up("will",6); if(L>=19)up("castingArcane",8);
  }
  const pb = r => r>0 ? r+L : 0;
  const C={B,L,M,P,pb};
  const at=B.attributes;
  C.hpMax = at.ancestryhp + (at.bonushp||0) + (at.classhp + M.con + (at.bonushpPerLevel||0))*L;
  C.speed = at.speed + (at.speedBonus||0);
  const armor=(B.armor||[]).find(a=>a.worn); const AR=(armor&&ARMOR[armor.name])||{ac:0,dexCap:99};
  C.armor=armor; C.armorDef=AR;
  C.acParts=[["Base",10],["Dex",Math.min(M.dex,AR.dexCap)],[`${RANK[P[armor?armor.prof:"unarmored"]||0][1]} ${armor?armor.prof:"unarmored"}`,pb(P[armor?armor.prof:"unarmored"]||0)]];
  if(AR.ac) C.acParts.push(["Armor",AR.ac]); if(armor&&armor.pot) C.acParts.push(["Potency",armor.pot]);
  C.ac=C.acParts.reduce((s,p)=>s+p[1],0);
  C.saves={fort:{n:"Fortitude",a:"con",r:P.fortitude},ref:{n:"Reflex",a:"dex",r:P.reflex},will:{n:"Will",a:"wis",r:P.will}};
  for(const s of Object.values(C.saves)) s.mod=M[s.a]+pb(s.r);
  C.per=M.wis+pb(P.perception);
  C.key=M[B.keyability]; C.classDC=10+C.key+pb(P.classDC);
  const specials=B.specials||[];
  C.school=(specials.find(s=>s.startsWith("Arcane School: "))||"").slice(15)||null;
  C.thesis=(specials.find(s=>s.startsWith("Arcane Thesis: "))||"").slice(15)||null;
  // Additional Lore extra increases at 3/7/15 when showing a level above the export
  const feats=B.feats||[];
  const assur=feats.find(f=>f[0]==="Assurance");
  const al=feats.find(f=>f[0]==="Additional Lore");
  C.alName = al ? ((al[1]||"").replace(/^Lore: /,"") || (feats.some(f=>f[0]==="Gnome Obsession") && assur && /^Lore: /.test(assur[1]||"") ? assur[1].slice(6) : null)) : null;
  C.skills=SKILLS.map(([k,n,a])=>({key:k,name:n,attr:a,rank:P[k]||0,mod:M[a]+pb(P[k]||0)}));
  C.lores=(B.lores||[]).map(([n,r])=>{let rank=r; if(n===C.alName && L>B.level) rank=Math.min(8, r+2*[3,7,15].filter(t=>t>B.level&&t<=L).length);
    return {key:"lore:"+n,name:n+" Lore",attr:"int",rank,mod:M.int+pb(rank),bumped:rank!==r};});
  C.skill = k => C.skills.find(s=>s.key===k) || C.lores.find(s=>s.key===k);
  if(assur && assur[1]){ const nm=assur[1].replace(/^Lore: /,""); const s=/^Lore: /.test(assur[1]) ? C.skill("lore:"+nm) : C.skills.find(x=>x.name===nm);
    if(s) C.assurance={name:s.name,key:s.key,value:10+pb(s.rank)}; }
  C.cantripRank=Math.ceil(L/2);
  C.casters=(B.spellCasters||[]).map((sc,i)=>{ const tk="casting"+cap(sc.magicTradition);
    const prof=sc.innate ? (sc.proficiency||0) : Math.max(sc.proficiency||0, P[tk]||0);
    const atk=M[sc.ability]+pb(prof); return {i,sc,trad:sc.magicTradition,prof,atk,dc:10+atk}; });
  C.focusCasters=[]; for(const [trad,byA] of Object.entries(B.focus||{})) for(const [abil,f] of Object.entries(byA)){
    const prof=Math.max(f.proficiency||0,P["casting"+cap(trad)]||0); const atk=M[abil]+pb(prof)+(f.itemBonus||0);
    C.focusCasters.push({trad,abil,atk,dc:10+atk,cantrips:f.focusCantrips||[],spells:f.focusSpells||[]}); }
  C.focusMax=B.focusPoints||0;
  // strikes
  const spec = r => L>=13 ? ({4:2,6:3,8:4}[r]||0) : 0;
  C.strikes=(B.weapons||[]).map(w=>{ const W=WEAPONS[w.name]||{traits:[],group:"",text:""}; const fin=W.traits.includes("Finesse");
    const r=P[w.prof]||0; const atk=(fin?Math.max(M.str,M.dex):M.str)+pb(r)+(w.pot||0);
    return {name:w.display||w.name,atk,map:W.traits.includes("Agile")?4:5,die:w.die,bonus:M.str+spec(r),type:w.damageType,W,rank:r,prof:w.prof}; });

function slotsFor(C,K){

function place(el){

      return `<div class="${active?"act":""}"><b>Heightened (${k})</b> ${v}${plus?` <span style="color:var(--dim)">· numbers above are for rank ${r}</span>`:""}</div>`; }).join("")+`</div>`;
  }

  if(opts.locked) h+=`<div class="notes"><div>From your ${esc(opts.source)} heritage. Cast it at will; it doesn't take a cantrip slot and can't be swapped out.</div></div>`;

const rankHead = (t,s,r,attrs)=>`<div class="rank-h" ${attrs||""}><span class="t">${t}</span><span class="s">${s}</span><span class="r">${r||""}</span></div>`;

/* prepared slots: export by default, S.prep[caster][rank] = [name|null] once you drag spells around */
let PREP={};
let STAFF_RES=null; /* {ki,r,i} of the Staff Nexus reserved slot, when active */
let WIZ_KI=null; /* K.i of the Wizard caster, for gating the curriculum slot to Wizard ranks only */
function bookRank(K,nm){
  for(const x of K.sc.spells||[]) if(x.list.includes(nm)) return x.spellLevel;
  for(const x of K.sc.prepared||[]) if(x.list.includes(nm)) return x.spellLevel;
  return null;
}
const rankOk = (base,r) => base===0 ? r===0 : r>=Math.max(1,base||0);
function prepSlots(K,slots,prep){
  const saved=S.prep&&S.prep[K.i], out={};
  const maxR=Math.max(0,...slots.map((n,r)=>n>0?r:0),...Object.keys(prep).map(Number));
  for(let r=0;r<=maxR;r++){
    const want=slots[r]||0;
    let arr;
    if(saved){ arr=(saved[r]||[]).slice(0,want); }
    else{
      arr=(prep[r]||[]).slice();
      // default export prep: seed the dedicated curriculum slot (last index) with a curriculum spell if the export has one elsewhere
      const cList=currRank(C,r);
      if(cList && want>0){
        const ci=want-1;
        if(!(arr[ci]!=null && cList.includes(arr[ci]))){
          const j=arr.findIndex((nm,idx)=>idx!==ci && nm!=null && cList.includes(nm));
          if(j>=0){ const t=arr[ci]; arr[ci]=arr[j]; arr[j]=t; }
        }
      }
    }
    while(arr.length<want) arr.push(null);
    out[r]=arr;
  }
  return out;
}

      const denom=arr.length-(resI>=0?1:0);
      const cur=currRank(C,r);
      h+=rankHead(`${ordn(r)} Rank`,`${slots[r]||0} slots${cur?` · 1 curriculum slot (${cur.join(", ")})`:""}${currWarn(r)}${resI>=0?" · a slot here is reserved for the Staff Nexus":""}${staffNoRoom&&r===sr?" · no normal slot free at this rank to charge the staff":""}`,`${used}/${denom} cast`,`data-rankdrop="${K.i}:${r}"`);
      h+=slotRows(r,r,"slot");
    }
    const resSpell = staffOn ? (P[sr]||[])[stI] : null;
    const inSlots=new Set();
    for(const [r,a] of Object.entries(P)){ const resI=(staffOn && +r===sr)?stI:-1; a.forEach((nm,i)=>{ if(nm && i!==resI) inSlots.add(nm); }); }
    const extra=[]; for(const [r,list] of Object.entries(book)) for(const nm of list) if(!inSlots.has(nm)) extra.push([+r,nm]);
    extra.sort((a,b)=>a[0]-b[0]||alpha(a[1],b[1]));
    h+=`<details class="book" data-bookdrop="${K.i}" ${S.bookOpen?"open":""}><summary>Spellbook, not prepared (${extra.length})</summary>`;
    extra.forEach(([r,nm])=>{
      // the spell hidden in the Staff Nexus reserved slot drags as a MOVE from that slot, not a plain book copy
      const fromSlot=(staffOn && r===sr && nm===resSpell) ? {r:sr,i:stI} : null;
      h+=spellRow(nm,r===0?cr:r,K,{kind:r===0?"cantrip":"book",curriculum:isCurr(C,nm),attrs:dragAttr(nm,fromSlot)});
    });
    if(!extra.length) h+=`<div class="row empty"><span></span><span></span><span class="nm">Every spellbook spell is prepared</span><span class="q"></span><span></span></div>`;
    h+=`</details>`;
  }
  for(const F of C.focusCasters){
    const cur = S.focus==null ? C.focusMax : Math.min(S.focus,C.focusMax);
    const K={trad:F.trad,atk:F.atk,dc:F.dc,sc:{ability:F.abil}};
    h+=`<div class="divider"></div>`+rankHead("Focus Spells",`${cap(F.trad)} · heightened to rank ${cr}`,`<span class="pips">${[...Array(C.focusMax).keys()].map(i=>`<button class="pip ${i<cur?"on":""}" data-focus="${i+1}" title="Focus Points"></button>`).join("")}</span>`);
    F.cantrips.slice().sort(alpha).forEach(n=>h+=spellRow(n,cr,K,{kind:"cantrip"}));
    F.spells.slice().sort(alpha).forEach(n=>h+=spellRow(n,cr,K,{kind:"focus"}));
  }
  for(const K of C.casters.filter(k=>k.sc.innate)){
    const list=byRank(K.sc.spells);
    const nonCantrip=Object.entries(list).filter(([r])=>+r!==0);
    if(!nonCantrip.length) continue;
    h+=`<div class="divider"></div>`+rankHead(`Innate · ${esc(K.sc.name)}`,`${cap(K.trad)} · ${K.sc.ability.toUpperCase()} · at will`,"");
    nonCantrip.forEach(([r,names])=> names.slice().sort(alpha).forEach(n=>h+=spellRow(n,+r,K,{kind:"slot"})));
  }
  setHTML($("#pSpells"), h);
}

function actionTip(it){
  const val = v => typeof v==="function" ? v(C) : v;
  const name = it.label ? it.label(C) : it.n;
  let h=`<div class="tt-h"><span class="tt-name">${glyph(it.a)}${esc(name)}</span><span class="tt-rank">${GLYPH_TITLE[it.a]||esc(it.a||"")}</span></div>`;
  if(it.t&&it.t.length) h+=`<div class="traits">${traitsHTML(it.t)}</div>`;
  if(it.freq) h+=`<div><b>Frequency</b> ${esc(it.freq)}</div>`;
  if(it.trig) h+=`<div><b>Trigger</b> ${esc(val(it.trig))}</div>`;
  if(it.req) h+=`<div><b>Requirements</b> ${esc(val(it.req))}</div>`;
  if(it.roll) h+=`<div class="line"><b>Roll.</b> ${val(it.roll)}</div>`;
  else if(it.sk){ const s=C.skill(it.sk); h+=`<div class="line"><b>${s.name} ${sg(s.mod)}</b> (${RANK[s.rank][1].toLowerCase()})${it.vs?` vs ${esc(it.vs)}`:""}</div>`; }
  const text=val(it.text); if(text) h+=`<p>${text}</p>`;
  h+=degHTML(it.deg);
  h+=conditionsFor((it.deg||[]).map(x=>x[1]).join(" ")+" "+(text||""));
  return h;
}

function actionRow(it){
  const q = ACTION_SUM[it.n] ? ACTION_SUM[it.n](C) : it.q ? it.q(C) : it.sk ? skl(C,it.sk) : "";
  const id=reg(()=>actionTip(it));
  return `<div class="row arow" data-tip="${id}">${glyph(it.a)}<span class="nm">${esc(it.label?it.label(C):it.n)}</span><span class="q">${linkConds(esc(q))}</span></div>`;
}
function strikeRow(s){
  const dmg = b => `1${s.die}${b?(b<0?"−":"+")+Math.abs(b):""}`;
  const two = s.W.traits.find(t=>/^Two-Hand d(\d+)/.test(t)); const twoDie = two ? two.split(" ")[1] : null;
  const id=reg(()=>{
    let h=`<div class="tt-h"><span class="tt-name">${glyph(1)}Strike: ${esc(s.name)}</span><span class="tt-rank">${esc(s.W.group||"")}</span></div><div class="traits">${traitsHTML(["Attack",...s.W.traits])}</div>`;
    h+=`<div class="line"><b>Attack</b> ${sg(s.atk)} / ${sg(s.atk-s.map)} / ${sg(s.atk-2*s.map)} <span style="color:var(--dim)">(${RANK[s.rank][1].toLowerCase()} ${s.prof}${s.map===4?", agile":""})</span></div>`;
    h+=`<div class="line"><b>Damage</b> ${dmg(s.bonus)} ${s.type==="B"?"bludgeoning":s.type==="P"?"piercing":"slashing"}${twoDie?` · two hands: 1${twoDie}${s.bonus?(s.bonus<0?"−":"+")+Math.abs(s.bonus):""}`:""}${s.W.traits.includes("Nonlethal")?" · nonlethal":""}</div>`;
    if(s.W.text) h+=`<p>${esc(s.W.text)}</p>`;
    h+=`<div class="deg"><div class="d cs"><b>Critical Success</b>Double damage</div><div class="d s"><b>Success</b>Normal damage</div></div>`;
    return h;});
  return `<div class="row arow" data-tip="${id}">${glyph(1)}<span class="nm">${esc(s.name)}</span><span class="q">${sg(s.atk)} / ${sg(s.atk-s.map)} / ${sg(s.atk-2*s.map)} · ${dmg(s.bonus)} ${s.type}${twoDie?` (2H 1${twoDie})`:""}${s.W.traits.includes("Nonlethal")?" nonlethal":""}</span></div>`;
}
function renderActions(){
  const tabs=[["encounter","Encounter"],["skills","Skill Actions"],["exploration","Exploration"]];
  let h=`<h2>Actions <small>hover for rules</small></h2><div class="tabs">${tabs.map(([k,n])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${n}</button>`).join("")}</div>`;
  const byName=(a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"});
  if(S.tab==="encounter"){ h+=`<div class="grp">Strikes</div>`+C.strikes.slice().sort((a,b)=>byName(a.name,b.name)).map(strikeRow).join(""); }
  for(const g of ACTIONS[S.tab]||[]){
    const label=it=>it.label?it.label(C):it.n;
    const items=g.items.filter(it=>!it.show||it.show(C)).sort((a,b)=>byName(label(a),label(b))); if(!items.length) continue;
    h+=`<div class="grp">${esc(g.group)}</div>`+items.map(actionRow).join("");
  }
  setHTML($("#pActions"), h);
}

function renderStats(){
  const B=C.B;
  const hp = S.hp==null ? C.hpMax : Math.min(S.hp,C.hpMax);
  const temp = S.temp||0;
  const tot = C.hpMax + temp;
  const tile=(k,v,x,tip,cls)=>`<div class="tile ${cls||""}" ${tip?`data-tip="${reg(tip)}"`:""}><div class="v">${v}</div><div class="k">${k}</div>${x?`<div class="x">${x}</div>`:""}</div>`;
  const brk=(title,parts,extra,signed)=>()=>{ const tot=parts.reduce((s,p)=>s+p[1],0);
    return `<div class="tt-h"><span class="tt-name">${title}</span><span class="tt-rank">${signed?sg(tot):tot}</span></div>${parts.map(([k,v])=>`<div class="line"><b>${esc(k)}</b> ${sg(v)}</div>`).join("")}${extra||""}`; };
  let h=`<h2>Stat Block <small>${esc(B.ancestry)} ${esc(B.class)} ${C.L}</small></h2>`;
  h+=`<div class="hp"><div class="hp-top"><span class="lbl">Hit Points</span><span class="hpnum"><b>${hp}</b> / ${C.hpMax}${temp?` <span style="color:var(--blue)">+${temp} temp</span>`:""}</span></div>
      <div class="bar"><i style="width:${Math.max(0,hp)/tot*100}%"></i><i class="tmp" style="width:${temp/tot*100}%"></i></div>
      <div class="hp-btns"><button data-hp="-5">−5</button><button data-hp="-1">−1</button><button data-hp="1">+1</button><button data-hp="5">+5</button><button data-hp="full" title="Restore to max">Full</button>
      <span class="tmpin">Temp <input type="number" min="0" id="tempHp" value="${temp}"></span></div></div>`;
  h+=`<div class="tiles">`;
  h+=tile("AC",C.ac,`${C.ac+1} w/ shield`,brk("Armor Class",C.acParts,`<p>${esc(C.armor?C.armor.name:"Unarmored")}. Shield cantrip adds +1 circumstance (AC ${C.ac+1}).</p>`),"gold");
  for(const s of Object.values(C.saves)) h+=tile(s.n.slice(0,s.n==="Fortitude"?4:s.n.length),sg(s.mod),RANK[s.r][1],brk(s.n,[[s.a.toUpperCase(),C.M[s.a]],[RANK[s.r][1],C.pb(s.r)]],"",true));
  h+=tile("Perception",sg(C.per),"low-light vision",brk("Perception",[["WIS",C.M.wis],[RANK[C.P.perception][1],C.pb(C.P.perception)]],`<p>Usually your initiative roll. Low-light vision: dim light doesn't conceal things from you.</p>`,true));
  h+=tile("Speed",C.speed,"feet");
  h+=tile("Class DC",C.classDC,B.keyability.toUpperCase(),brk("Class DC",[["Base",10],[B.keyability.toUpperCase(),C.key],[RANK[C.P.classDC][1],C.pb(C.P.classDC)]]));
  const wiz=C.casters.find(k=>!k.sc.innate);
  if(wiz){ h+=tile("Spell DC",wiz.dc,`attack ${sg(wiz.atk)}`,brk("Spell DC",[["Base",10],[wiz.sc.ability.toUpperCase(),C.M[wiz.sc.ability]],[RANK[wiz.prof][1],C.pb(wiz.prof)]],`<p>Spell attack ${sg(wiz.atk)}.</p>`),"gold"); }
  h+=tile("Size",esc(B.sizeName),"");
  h+=`</div>`;
  const focus = S.focus==null ? C.focusMax : Math.min(S.focus,C.focusMax);
  h+=`<div class="trackers"><div class="trk"><span class="k">Hero Points</span><span class="pips">${[1,2,3].map(i=>`<button class="pip ${i<=S.hero?"on":""}" data-hero="${i}"></button>`).join("")}</span></div>`;
  if(C.focusMax) h+=`<div class="trk"><span class="k">Focus</span><span class="pips">${[...Array(C.focusMax).keys()].map(i=>`<button class="pip ${i<focus?"on":""}" data-focus="${i+1}"></button>`).join("")}</span></div>`;
  h+=`</div>`;
  h+=`<h3>Attributes</h3><div class="attrs">${["str","dex","con","int","wis","cha"].map(k=>`<div class="attr ${k===B.keyability?"key":""}"><div class="k">${k.toUpperCase()}</div><div class="v">${sg(C.M[k])}</div></div>`).join("")}</div>`;
  h+=`<h3>Skills</h3><div class="skills">`;
  const skRow=(s,wide)=>{ const tip = s.key===(C.assurance&&C.assurance.key) || s.bumped ? `data-tip="${reg(()=>`<div class="tt-h"><span class="tt-name">${esc(s.name)}</span><span class="tt-rank">${RANK[s.rank][1]}</span></div><div class="line"><b>Modifier</b> ${sg(s.mod)} = ${s.attr.toUpperCase()} ${sg(C.M[s.attr])} + ${RANK[s.rank][1]} ${C.pb(s.rank)}</div>${C.assurance&&C.assurance.key===s.key?`<div class="line"><b>Assurance</b> ${C.assurance.value} (10 + proficiency, no other modifiers)</div>`:""}${s.bumped?`<p>Additional Lore's extra skill increases (levels 3, 7, 15) raise this to ${RANK[s.rank][1].toLowerCase()}. The export predates that.</p>`:""}`)}"` : "";
    return `<div class="sk ${s.rank?"":"untr"} ${wide?"wide":""}" ${tip}><span class="rk r${s.rank}">${RANK[s.rank][0]}</span><span class="n">${esc(s.name)}${C.assurance&&C.assurance.key===s.key?` <span style="color:var(--gold);font-size:11px">A ${C.assurance.value}</span>`:""}</span><span class="m">${sg(s.mod)}</span></div>`; };
  h+=C.skills.map(s=>skRow(s)).join("")+C.lores.map(s=>skRow(s,true)).join("")+`</div>`;
  const langs=(B.languages||[]).filter(l=>l && l!=="None selected");
  h+=`<div class="meta"><b>Ancestry</b> ${esc(B.ancestry)} (${esc(B.heritage)}) · <b>Background</b> ${esc(B.background)} · <b>Alignment</b> ${esc(B.alignment)}</div>`;
  h+=`<div class="meta"><b>Languages</b> ${langs.length?esc(langs.join(", ")):'<span style="color:var(--dim)">not set in export</span>'} · <b>Deity</b> ${esc(B.deity)}</div>`;
  setHTML($("#pStats"), h);
}

function bulkVal(v){ return v==="L"?1 : (v==="-"||v==null)?0 : Math.round(+v*10); } // in tenths
function bulkTxt(t){ const b=Math.floor(t/10), l=t%10; return b&&l?`${b} Bulk + ${l} L`:b?`${b} Bulk`:l?`${l} L`:"negligible"; }
function renderInv(){
  const B=C.B, m=S.coins||B.money||{};
  let h=`<h2>Inventory</h2><div class="coins">${["pp","gp","sp","cp"].map(k=>`<div class="coin ${k}" data-coin="${k}" title="Click to edit"><div class="v">${m[k]||0}</div><div class="k">${k.toUpperCase()}</div></div>`).join("")}</div>${S.coins!=null?`<button class="lnk" data-coinreset="1">reset to export</button>`:""}`;
  const containers=B.equipmentContainers||{};
  const eq=(B.equipment||[]).map(e=>({name:e[0],qty:e[1],cont:containers[e[2]]?e[2]:null}));
  let worn=0, unknown=[];
  const irow=(name,qty,bulkStr,tipFn)=>`<div class="row irow" ${tipFn?`data-tip="${reg(tipFn)}"`:""}><span class="nm">${esc(name)}</span><span class="qty">${qty>1?"×"+qty:""}</span><span class="q">${bulkStr}</span></div>`;
  const itemTip=(name,qty,def,extra)=>()=>`<div class="tt-h"><span class="tt-name">${esc(name)}</span><span class="tt-rank">${qty>1?"×"+qty+" · ":""}Bulk ${def&&def.bulk!=null?(def.bulk==="-"?"—":def.bulk):"?"}</span></div>${def&&def.traits?`<div class="traits">${traitsHTML(def.traits)}</div>`:""}<p>${def?esc(def.text||""):"No entry in the dashboard's item list."}</p>${extra||""}`;
  h+=`<h3>Worn &amp; Held</h3>`;
  for(const a of B.armor||[]){ const d=ARMOR[a.name]; const b=d?bulkVal(d.bulk):0; worn+=b; if(!d) unknown.push(a.name);
    h+=irow(a.display||a.name,a.qty,d?bulkTxt(b):"?",itemTip(a.display||a.name,a.qty,d,`<div class="line"><b>AC</b> ${C.ac} total · Dex cap ${sg(d?d.dexCap:0)}${a.worn?" · worn":""}</div>`)); }
  for(const w of B.weapons||[]){ const d=WEAPONS[w.name]; const b=d?bulkVal(d.bulk)*w.qty:0; worn+=b; if(!d) unknown.push(w.name);
    const s=C.strikes.find(x=>x.name===(w.display||w.name));
    h+=irow(w.display||w.name,w.qty,d?bulkTxt(b):"?",itemTip(w.display||w.name,w.qty,d?{...d,bulk:String(d.bulk)}:null,s?`<div class="line"><b>Strike</b> ${sg(s.atk)} · 1${s.die}${s.bonus?(s.bonus<0?"−":"+")+Math.abs(s.bonus):""} ${s.type}</div>`:"")); }
  for(const e of eq.filter(e=>!e.cont)){ const d=ITEMS[e.name]; const isPack=containers && Object.values(containers).some(c=>c.containerName===e.name&&c.backpack);
    const b=d?bulkVal(isPack?(d.worn||d.bulk):d.bulk)*e.qty:0; worn+=b; if(!d) unknown.push(e.name);
    h+=irow(e.name,e.qty,d?bulkTxt(b):"?",itemTip(e.name,e.qty,d)); }
  let packRelief=0;
  for(const [id,c] of Object.entries(containers)){
    const inside=eq.filter(e=>e.cont===id); let sum=0;
    let rows=inside.map(e=>{ const d=ITEMS[e.name]; const known=d&&d.bulk!==null; const b=known?bulkVal(d.bulk)*e.qty:0; sum+=b; if(!known&&!c.bagOfHolding) unknown.push(e.name); return irow(e.name,e.qty,known?bulkTxt(b):"?",itemTip(e.name,e.qty,d)); }).join("");
    if(c.bagOfHolding){
      h+=`<h3>${esc(c.containerName)} <span style="text-transform:none;letter-spacing:0;color:var(--dim)">· marked extradimensional in Pathbuilder; contents not counted</span></h3>`+rows;
      continue;
    }
    const relief=c.backpack?Math.min(sum,20):0; packRelief+=relief; worn+=sum;
    h+=`<h3>${esc(c.containerName)} <span style="text-transform:none;letter-spacing:0;color:var(--dim)">· ${bulkTxt(sum)} inside${relief?`, ${bulkTxt(relief)} doesn't count`:""}</span></h3>`+rows;
  }
  const total=worn-packRelief, enc=(5+C.M.str)*10, max=(10+C.M.str)*10;
  h+=`<div class="bulk">Carrying <b>${bulkTxt(total)}</b> · <span class="cond" data-cond="encumbered">encumbered</span> above <b>${enc/10}</b> · max <b>${max/10}</b>${unknown.length?`<br><span style="color:var(--f)">No Bulk data for: ${esc([...new Set(unknown)].join(", "))}</span>`:""}<div class="meter"><i class="${total>enc?"enc":""}" style="width:${Math.min(100,total/max*100)}%"></i></div></div>`;
  setHTML($("#pInv"), h);
}

  h+=npc("Seela Longstrider","Traveling minstrel — kindred spirit, may be more than she appears","On the road","UNKNOWN");
  h+=npc("Bram the Earthmover","Dwarven strongman — Lorum's genuine friend","Whereabouts unknown","ALLY");

function renderRules(){
  const rule=(t,b,s)=>`<div class="rule"><div class="rt">${esc(t)}</div><div class="rb">${linkConds(esc(b))}</div><div class="rs">${esc(s)}</div></div>`;
  let h=`<h2>Rules Clarifications <small>checked against the books</small></h2>`;
  h+=`<h3>Slots and preparation</h3>`;
  h+=rule("Curriculum slots are extra","You prepare five cantrips and your normal slots, plus one extra cantrip and one extra slot of every rank you can cast. The extras hold curriculum spells only. At level 3 that is 6 cantrips, four 1st-rank slots and three 2nd-rank slots.","Player Core p. 192");
  h+=rule("Cantrips heighten on their own","Cantrips and focus spells always cast at half your level rounded up: rank 2 now, rank 3 at level 5. At rank 2 that means Electric Arc 3d4, Scatter Scree 3d4 and Phase Bolt 4d4, while Daze stays 1d6 and Shield stays Hardness 5 until rank 3.","Player Core p. 192 and p. 198");

function mcard(m){
  // data values are display strings ("+6", "−2", "cold 5, fire 5"); arrays tolerated too
  const str=v=>Array.isArray(v)?v.join(", "):(v==null?"":String(v));
  const num=v=>{ const t=str(v); return /^[+−-]/.test(t)||t===""?t:(isNaN(+t)?t:sg(+t)); };
  const line=(lbl,val)=>val?`<p><b>${lbl}</b> ${val}</p>`:"";
  const strikeLine=s=>`<p>${glyph(1)}<b>${s.ranged?"Ranged":"Melee"}</b> ${esc(s.name)} ${esc(num(s.bonus))}${str(s.traits)?` (${esc(str(s.traits))})`:""}, <b>Damage</b> ${esc(s.damage)}</p>`;
  const abilLine=a=>`<p>${a.act!=null?glyph(a.act):""}<b>${esc(a.name)}</b> ${esc(a.text||"")}</p>`;
  const defTraits=[str(m.immunities)?`<b>Immunities</b> ${esc(str(m.immunities))}`:"",
    str(m.weaknesses)?`<b>Weaknesses</b> ${esc(str(m.weaknesses))}`:"",
    str(m.resistances)?`<b>Resistances</b> ${esc(str(m.resistances))}`:""].filter(Boolean);
  return `<div class="mcard">
    <div class="mh"><b>${esc(m.name)}</b><span>Creature ${m.level<0?"−"+Math.abs(m.level):m.level}</span></div>
    <div class="traits">${traitsHTML([m.size,...(m.traits||[])])}</div>
    ${line("Perception",`${esc(num(m.perception))}${m.senses?`, ${esc(m.senses)}`:""}`)}
    ${line("Languages",m.languages?esc(m.languages):"")}
    ${line("Skills",m.skills?esc(m.skills):"")}
    ${m.attrs?`<p style="color:var(--dim)">${esc(m.attrs)}</p>`:""}
    <p><b>AC</b> ${m.ac} · <b>Fort</b> ${esc(num(m.fort))} · <b>Ref</b> ${esc(num(m.ref))} · <b>Will</b> ${esc(num(m.will))} · <b>HP</b> ${m.hp}${m.hpNote?` (${esc(m.hpNote)})`:""}</p>
    ${defTraits.length?`<p>${defTraits.join(" · ")}</p>`:""}
    ${line("Speed",m.speed?esc(m.speed):"")}
    ${(m.strikes||[]).map(strikeLine).join("")}
    ${(m.abilities||[]).map(abilLine).join("")}
    <div class="foot">${esc(m.source||"")}${m.url?` · <a href="${AON}${m.url}" target="_blank" rel="noopener">AoN ↗</a>`:""}</div>
  </div>`;
}
function renderMinions(){
  let h=`<h2>Minions</h2>`;
  if(C.familiar){
    const F=C.familiar, K=C.casters.find(k=>!k.sc.innate), smod=K?C.M[K.sc.ability]:3;
    const pas=C.L+(F.pet?3:Math.max(3,smod));
    const kind=F.pet?"Pet":"Familiar";
    const fast=F.abilities.some(a=>/^Fast Movement/.test(a));
    const stat=(k,v,title)=>`<span title="${title}">${k}<b>${v}</b></span>`;
    const abil=F.abilities.map(a=>{ const key=Object.keys(PET_ABILITIES).find(k=>a.startsWith(k)); return `<p><b>${esc(a)}</b>${key?` ${PET_ABILITIES[key]}`:""}</p>`; }).join("");
    h+=`<h3>${esc(F.name)} <span class="h3s">${kind} ${C.L} · Tiny · Minion</span></h3>
      <div class="pet-line">${stat("HP",5*C.L,"Hit Points")}${stat("AC",C.ac,"Armor Class")}${stat("Spd",fast?40:25,"Speed in feet")}${stat("Fort",sg(C.saves.fort.mod),"Fortitude")}${stat("Ref",sg(C.saves.ref.mod),"Reflex")}${stat("Will",sg(C.saves.will.mod),"Will")}</div>
      <div class="pet-list">
        <p><b>Perception</b> ${sg(pas)} · low-light vision</p>
        <p><b>Acrobatics</b> ${sg(pas)} · <b>Stealth</b> ${sg(pas)} · other skills ${sg(C.L)}</p>
        ${abil||'<p><b>Abilities</b> <span style="color:var(--dim)">none recorded</span></p>'}
      </div>
      <div class="pet-note">${F.pet?"Command an Animal (1 action, no Nature check) gives it 2 actions. No attack actions except Escape and Force Open.":"Empathic link within 1 mile. Command it (1 action) to give it 2 actions."}</div>
      <div class="pet-src">${F.pet?"Pet feat: HP 5 per level, your AC and saves, 3 + level for Perception, Acrobatics and Stealth.":"HP 5 per level, your AC and saves, level + spellcasting modifier for Perception, Acrobatics and Stealth."} Source: ${esc(F.source)}.</div>`;
  } else {
    h+=`<p>No pet or familiar in this build.</p>`;
  }
  h+=`<h3>Summon Undead</h3><p class="pet-note">Rank 1 spell, 3 actions, sustained up to 1 minute. The creature takes 2 actions right after you cast; after that, Sustain to command it. It must be common.</p>`;
  const WK=C.casters.find(k=>!k.sc.innate);
  if(WK){
    const slots=slotsFor(C,WK);
    let prevMax=null;
    for(const r of [1,2]){
      if(!((slots[r]||0)>0)) continue;
      const max=SUMMON_MAX_LEVEL[r];
      const sub = r===1 ? "level −1 or lower" : "level 1 or lower";
      h+=`<h3>${ordn(r)}-rank slot <span class="h3s">${sub}</span></h3>`;
      const list = UNDEAD_SUMMONS.filter(m=> prevMax==null ? m.level<=max : (m.level>prevMax && m.level<=max));
      if(list.length){
        h+=`<div class="mcards">${list.map(mcard).join("")}</div>`;
        if(r>1) h+=`<p class="pet-note">Plus every option from the 1st-rank slot.</p>`;
      } else {
        h+=`<p class="pet-note">No creature data for this rank yet.</p>`;
      }
      prevMax=max;
    }
  }
  setHTML($("#pMinions"), linkConds(h));
}

/* ============================================================
   Collapsible group headers (post-render DOM pass)
   ============================================================ */
const HEAD_SEL=".grp, h3, .rank-h";
const STOP_SEL=".grp, h3, .rank-h, h2, .caster-h, .divider, .tabs, details.book";
function applyCollapse(){
  for(const paneId of ["pSpells","pMinions","pActions","pInv","pFeats","pCampaign","pRules"]){
    const pane=$("#"+paneId); if(!pane) continue;
    const headers=Array.from(pane.children).filter(el=>el.matches(HEAD_SEL));
    for(const hd of headers){
      let label;
      if(hd.classList.contains("rank-h")){ const s=hd.querySelector(".t"); label=s?s.textContent.trim():""; }
      else if(hd.tagName==="H3"){ let txt=""; for(const n of hd.childNodes){ if(n.nodeType===3 && n.textContent.trim()){ txt=n.textContent.trim(); break; } } label=txt; }
      else { label=hd.textContent.trim(); }
      const key=`${paneId}:${label}`;
      const body=[]; let sib=hd.nextElementSibling;
      while(sib && !sib.matches(STOP_SEL)){ body.push(sib); sib=sib.nextElementSibling; }
      if(!body.length) continue;
      const secb=document.createElement("div"); secb.className="secb";
      body.forEach(el=>secb.appendChild(el));
      hd.after(secb);
      hd.dataset.coll=key;
      const collapsed=!!S.coll[key];
      hd.classList.toggle("closed",collapsed);
      secb.classList.toggle("closed",collapsed);
      hd.insertBefore(Object.assign(document.createElement("span"),{className:"car",textContent:"▾"}),hd.firstChild);
      if(collapsed){
        const rows=secb.querySelectorAll(".row"); const n=rows.length||secb.children.length;
        const cn=Object.assign(document.createElement("span"),{className:"cn",textContent:`${n} hidden`});
        if(hd.classList.contains("rank-h")){ const s=hd.querySelector(".s"); if(s) s.appendChild(cn); else hd.appendChild(cn); }
        else hd.appendChild(cn);
      }
    }
  }
}

function startCoinEdit(tile){
  if(tile.querySelector("input")) return;
  const k=tile.dataset.coin, B=getBuild();
  const cur=(S.coins||B.money||{})[k]||0;
  const vEl=tile.querySelector(".v"); if(!vEl) return;
  setHTML(vEl, `<input type="number" min="0" value="${cur}">`);
  const inp=vEl.querySelector("input");
  inp.focus(); inp.select();
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    let n=parseInt(inp.value,10);
    if(isNaN(n)) n=cur;
    n=Math.max(0,n);
    if(S.coins==null){ const bm=B.money||{}; S.coins={pp:bm.pp||0,gp:bm.gp||0,sp:bm.sp||0,cp:bm.cp||0}; }
    S.coins[k]=n;
    render();
  };
  const cancel=()=>{ if(done) return; done=true; vEl.textContent=cur; };
  inp.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); commit(); }
    else if(ev.key==="Escape"){ ev.preventDefault(); cancel(); }
  });
  inp.addEventListener("blur",commit);
}

document.addEventListener("click",e=>{
  const t=e.target;

  const coin=t.closest("[data-coin]");

    const key=collHd.dataset.coll, closed=!collHd.classList.contains("closed");
    collHd.classList.toggle("closed",closed);
    const secb=collHd.nextElementSibling;
    if(secb && secb.classList.contains("secb")) secb.classList.toggle("closed",closed);
    if(closed) S.coll[key]=1; else delete S.coll[key];
    saveState();
    const pinnedRow=document.querySelector(".row.pinned");
    if(closed && pinnedRow && secb && secb.contains(pinnedRow)) hideTip();
    return;
  }
  if(t.closest("#ctip")) return;
  if(!ctipEl.hidden) hideCond();
  const btn=t.closest("[data-use],[data-hp],[data-hero],[data-focus],[data-drain],[data-tab],[data-lvlreset],[data-import],[data-prepreset],[data-staffcharge],[data-staffedit],[data-main],[data-coinreset]");
  if(btn){
    const d=btn.dataset;
    if(d.use!=null){ S.used[d.use]=!S.used[d.use]; }
    else if(d.prepreset!=null){ if(S.prep) delete S.prep[d.prepreset]; Object.keys(S.used).forEach(k=>{ if(k.startsWith(d.prepreset+":")) delete S.used[k]; }); }
    else if(d.hp!=null){ const max=C.hpMax; let hp=S.hp==null?max:Math.min(S.hp,max);
      if(d.hp==="full"){ hp=max; }
      else { const n=+d.hp; if(n<0){ let dmg=-n; const ab=Math.min(S.temp||0,dmg); S.temp=(S.temp||0)-ab; dmg-=ab; hp=Math.max(0,hp-dmg); } else hp=Math.min(max,hp+n); }
      S.hp=hp; }
    else if(d.hero!=null){ const n=+d.hero; S.hero = S.hero===n ? n-1 : n; }
    else if(d.focus!=null){ const n=+d.focus; const cur=S.focus==null?C.focusMax:S.focus; S.focus = cur===n ? n-1 : n; }
    else if(d.drain!=null){ S.drain=!S.drain; }
    else if(d.staffcharge!=null){ const max=S.staff.chargeRank, rem=Math.max(0,max-S.staff.spent), n=+d.staffcharge, nr = rem===n ? n-1 : n; S.staff.spent=max-nr; }
    else if(d.staffedit!=null){ S.staff.edit=!S.staff.edit; }
    else if(d.tab!=null){ S.tab=d.tab; }
    else if(d.main!=null){ S.mainTab=d.main; hideTip(); }
    else if(d.coinreset!=null){ S.coins=null; }
    else if(d.lvlreset!=null){ S.level=getBuild().level; }
    else if(d.import!=null){ openImport(); return; }
    render(); return;
  }
  if(t.closest("#tip")) return;
  const el=t.closest("[data-tip]");
  if(el){ if(pinned===el.dataset.tip){ hideTip(); } else { pinned=el.dataset.tip; showTip(el,true); } return; }
  if(pinned) hideTip();
});

  else if(e.target.matches("select[data-staff]")){

    if(key==="chargeRank"){ S.staff.chargeRank=+e.target.value; S.staff.spent=0; }

    if(S.staff.cantrip && S.staff.spell) S.staff.edit=false;
    render();
  }
});

/* drag spells between the spellbook and prepared slots (Ctrl while dropping copies a prepared spell) */
let DRAG=null, dropEl=null;
const DROP_T="[data-slot],[data-rankdrop],[data-bookdrop]";
// index of the dedicated curriculum slot for (caster,rank), or -1 if none applies there
function curIdx(ki,r){
  if(ki!==WIZ_KI) return -1;
  const cl=currRank(C,r), arr=(PREP[ki]||{})[r]||[];
  return (cl && arr.length>0) ? arr.length-1 : -1;
}
function dropInfo(el){
  if(!DRAG||!el) return null;
  if(el.dataset.bookdrop!=null){
    if(+el.dataset.bookdrop!==DRAG.ki || !DRAG.from) return null;
    // dragging the Staff Nexus reserved-slot entry back onto the book it's already shown in: no-op, not a valid drop
    if(STAFF_RES && DRAG.ki===STAFF_RES.ki && DRAG.from.r===STAFF_RES.r && DRAG.from.i===STAFF_RES.i) return null;
    return {book:true};
  }
  const [ki,r,si]=(el.dataset.slot!=null?el.dataset.slot:el.dataset.rankdrop).split(":").map(Number);
  if(ki!==DRAG.ki || !rankOk(DRAG.base,r)) return null;
  const arr=(PREP[ki]||{})[r]||[];
  const resI=(STAFF_RES && STAFF_RES.ki===ki && STAFF_RES.r===r) ? STAFF_RES.i : -1;
  const ci=curIdx(ki,r);
  const qualifies = ci<0 || currRank(C,r).includes(DRAG.name);
  let i;
  if(el.dataset.slot!=null){ i=si; if(i===ci && !qualifies) return null; }
  else { i = arr.findIndex((v,idx)=>v===null && idx!==resI && (idx!==ci || qualifies)); }
  if(i<0 || i===resI || (DRAG.from && DRAG.from.r===r && DRAG.from.i===i)) return null;
  return {r,i};
}
function endDrag(){
  DRAG=null; dropEl=null;
  document.querySelectorAll(".drop-ok,.drop-hover,.dragsrc").forEach(el=>el.classList.remove("drop-ok","drop-hover","dragsrc"));
}
document.addEventListener("dragstart",e=>{
  const row=e.target.closest&&e.target.closest("[data-drag]"); if(!row) return;
  try{ DRAG=JSON.parse(row.dataset.drag); }catch(err){ DRAG=null; return; }
  e.dataTransfer.effectAllowed="copyMove"; e.dataTransfer.setData("text/plain",DRAG.name);
  clearTimeout(showT); hideTip(); hideCond();
  row.classList.add("dragsrc");
  document.querySelectorAll(DROP_T).forEach(el=>{ if(dropInfo(el)) el.classList.add("drop-ok"); });
});
document.addEventListener("dragover",e=>{
  if(!DRAG) return;
  const el=e.target.closest&&e.target.closest(DROP_T), info=el?dropInfo(el):null;
  if(dropEl!==(info?el:null)){ if(dropEl) dropEl.classList.remove("drop-hover"); dropEl=info?el:null; if(dropEl) dropEl.classList.add("drop-hover"); }
  if(info){ e.preventDefault(); e.dataTransfer.dropEffect=(e.ctrlKey&&DRAG.from&&!info.book)?"copy":"move"; }
});
document.addEventListener("drop",e=>{
  if(!DRAG) return;
  const el=e.target.closest&&e.target.closest(DROP_T), info=el?dropInfo(el):null;
  if(!info){ endDrag(); return; }
  e.preventDefault();
  const ki=DRAG.ki, K=C.casters.find(k=>k.i===ki), f=DRAG.from, key=(r,i)=>`${ki}:${r}:${i}`;
  const P={}; for(const [r,a] of Object.entries(PREP[ki])) P[r]=a.slice();
  const setUsed=(r,i,v)=>{ if(v) S.used[key(r,i)]=true; else delete S.used[key(r,i)]; };
  if(info.book){ P[f.r][f.i]=null; setUsed(f.r,f.i,false); }
  else if(f && !e.ctrlKey){
    // move; the spell already in the target slot swaps back if it fits the source rank, otherwise returns to the spellbook
    const target=P[info.r][info.i], tUsed=!!S.used[key(info.r,info.i)], fUsed=!!S.used[key(f.r,f.i)];
    let back = target && rankOk(bookRank(K,target)??info.r, f.r);
    if(back && f.i===curIdx(ki,f.r) && !currRank(C,f.r).includes(target)) back=false; // don't swap a non-curriculum spell back into the curriculum slot
    P[info.r][info.i]=DRAG.name; setUsed(info.r,info.i,fUsed);
    P[f.r][f.i]=back?target:null; setUsed(f.r,f.i,back&&tUsed);
  } else { P[info.r][info.i]=DRAG.name; setUsed(info.r,info.i,false); }
  S.prep=S.prep||{}; S.prep[ki]=P;
  endDrag(); render();
});
document.addEventListener("dragend",endDrag);

$("#btnImport").onclick=openImport;

const dlg=$("#dlg");
function openImport(){ $("#impErr").textContent=""; $("#impText").value=""; $("#impFile").value=""; if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); }
$("#impCancel").onclick=()=>dlg.close();
$("#impFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{$("#impText").value=rd.result;}; rd.readAsText(f); };
$("#impGo").onclick=()=>{
  try{
    const obj=JSON.parse($("#impText").value.trim()); const b=obj.build||obj;
    if(!b||!b.abilities||!b.proficiencies||!b.level) throw new Error("That JSON doesn't look like a Pathbuilder build (no abilities, proficiencies or level).");
    S.imported=b; S.level=b.level; S.hp=null; S.used={}; S.focus=null; S.prep=null; S.coins=null;
    dlg.close(); render();
  }catch(err){ $("#impErr").textContent=err.message; }
};
$("#impReset").onclick=()=>{ S.imported=null; S.level=DEFAULT_LEVEL; S.hp=null; S.used={}; S.prep=null; S.coins=null; dlg.close(); render(); };
window.addEventListener("resize",()=>{ if(!tipEl.hidden) hideTip(); if(!ctipEl.hidden) hideCond(); });

render();
</script>
</body>
</html>
